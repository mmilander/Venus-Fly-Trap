<!--A locally hosted webpage that the n8n harness will retrieve-->

<!DOCTYPE html> <!--tells browser what type of document it's reading-->
<html lang="en"> <!--English page-->
<head> <!--Contains info about webpage (not actually displayed on page)-->
    <title>Venus Fly Trap - Test Page</title> <!--Sets name that get's displayed in browser tab-->
</head>
<body> <!--Contains the webpage's content-->
    <h1>Venus Fly Trap - Test Website</h1> <!--Creates main heading on webpage-->
    <p>This is a local test page for the Venus Fly Trap experiment.</p> <!--Creates a paragarph-->
</body>
</html>
